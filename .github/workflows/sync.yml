name: Notion Calendar Sync

on:
  workflow_dispatch:
  schedule:
    # 매 정시(0분, 5분 등 딱 떨어지는 시각)는 GitHub Actions
    # 부하가 몰려서 "runner not acquired" 에러가 더 자주 발생합니다.
    # 3분 오프셋을 줘서 그 시간대를 살짝 비껴가도록 했습니다.
    - cron: "3-59/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install notion-client google-api-python-client google-auth

      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python notion_to_calendar.py
